<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Избранные фильмы и сериалы пользователя Киносферы" />
    <meta name="theme-color" content="#09090b" />
    <title>Избранное — Киносфера</title>
  </head>
  <body>
    <header class="site-header inner-header">
      <a class="brand" href="/index.html" aria-label="Киносфера, на главную">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>КИНОСФЕРА</span>
      </a>
      <nav class="main-nav" aria-label="Основная навигация">
        <a href="/index.html#catalog">Каталог</a>
        <a href="/favorites.html" aria-current="page">Избранное</a>
      </nav>
      <a class="header-link" href="/index.html#catalog">Добавить фильмы</a>
    </header>

    <main class="subpage-main favorites-page">
      <section class="page-hero page-hero-compact">
        <h1>Сохранённая коллекция</h1>
        <p>Проекты, которые вы отметили сердцем в каталоге, хранятся в этом браузере.</p>
      </section>
      <section class="favorites-content" aria-labelledby="favoritesTitle">
        <div class="section-heading">
          <h2 id="favoritesTitle">Мой список</h2>
          <p class="section-note" id="favoritesNote">Загрузка…</p>
        </div>
        <div class="status" id="favoritesStatus" role="status" aria-live="polite">Загрузка…</div>
        <div class="movie-grid" id="favoritesGrid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="brand brand-footer" href="/index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>КИНОСФЕРА</span>
      </a>
      <p>Избранное хранится локально в вашем браузере</p>
    </footer>
    <script type="module" src="/src/favorites.js"></script>
  </body>
</html>
